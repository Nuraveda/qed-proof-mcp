# Publishes @qed-proof/mcp to npm when a release tag (mcp-vX.Y.Z) is pushed, with npm trusted publishing (OIDC) and
# provenance: no token is stored anywhere. The tag must match package.json, and a version already on npm is skipped
# rather than failed (the first release, 0.1.0, was bootstrapped by hand before trusted publishing could be set up).
name: publish
on:
  push:
    tags: ["mcp-v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    # Gated: the `npm` environment requires a maintainer's approval and only accepts mcp-v* tags.
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json
        run: |
          v=$(node -p "require('./package.json').version")
          test "mcp-v$v" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} but package.json is $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: npm 11.5.1+ (trusted publishing needs it)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Publish (skipped if this version is already on npm)
        run: |
          if npm view "@qed-proof/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@qed-proof/mcp@${VERSION} is already published; nothing to do"
          else
            npm publish --provenance --access public
          fi

  github-release:
    # Creates (or refreshes) the GitHub Release for the tag once the package is on the registry; the release body is that
    # version's section of the changelog. Separate job so `contents: write` is held by nothing that publishes.
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create or update the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#mcp-v}"
          awk -v v="$VERSION" 'BEGIN{h="## [" v "]"} index($0,h)==1{p=1;next} p&&(/^## \[/||/^\[[^]]+\]: http/){exit} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG.md section for $VERSION"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 && gh release edit "$TAG" --title "@qed-proof/mcp $VERSION" --notes-file notes.md --latest \
            || gh release create "$TAG" --verify-tag --title "@qed-proof/mcp $VERSION" --notes-file notes.md --latest
